name: Deploy 561.group

# TEMPORARY CONSOLIDATION GATE
#
# Do not automatically publish every main-branch change while the 561 Group
# web estate has multiple competing source/render/deploy implementations.
# Production deployment is explicit until 561-group/561-group#51 settles a
# single source → TUFTE render → deploy → public-witness chain for 561.group.
on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: 561-group-production
  cancel-in-progress: false

jobs:
  deploy:
    # A manual dispatch on an unreviewed ref must not write production.
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      # Temporary production release interlock. This repository's standalone
      # checkout lacks the original pinned PNPM/Play/LivingWebServer closure;
      # public/ build outputs are untracked. Invoking Wrangler directly here
      # could replace the working site with incomplete assets. This fails
      # closed until the original source-qualified build -> test -> release ->
      # independent public-witness chain in PR #21 and issue #17 is accepted.
      - name: Refuse unqualified standalone deployment
        run: |
          echo "::error::The bare checkout is not a qualified production artifact. Recover the pinned integrated workspace, run the native tests/build and receive the exact public revision before enabling deployment (PR #21; issue #17)."
          exit 1
      - uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          wranglerVersion: 4.118.0
          command: deploy --config wrangler.jsonc
