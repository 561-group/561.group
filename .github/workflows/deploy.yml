name: Publish and receive 561.group (TUFTE + LivingWebServer)
# main is the intended production source, not an unreviewed publication.
# Changes enter through PR source qualification; this release repeats the
# original tests, builds the pinned supplier, deploys, then reads public bytes.
on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: 561-group-production
  cancel-in-progress: false

jobs:
  deploy:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24'
      - name: Refuse a production release without the original exact package lock
        run: |
          test -s package-lock.json || {
            echo '::error::The original source has no committed npm lockfile; do not deploy a best-effort install.'
            exit 1
          }
      - name: Install original 561 registry suppliers and pinned LivingWebServer
        timeout-minutes: 6
        run: npm ci --omit=optional --ignore-scripts --no-audit --no-fund
      - name: Qualify the actual original Worker, TUFTE and other retained routes
        run: |
          npm run check
          npm test
          npm run build
      - name: Refuse incomplete release, duplicate homepage or wrong source revision
        run: |
          node --input-type=module <<'NODE'
          import { readFile,stat } from 'node:fs/promises';
          const text=async name=>readFile(name,'utf8');
          const receipt=JSON.parse(await text('public/source-revision.json'));
          if(receipt.sourceCommit!==process.env.GITHUB_SHA ||
             receipt.repository!=='561-group/561.group' ||
             receipt.renderer!=='TUFTE' || receipt.application!=='LivingWebServer') {
            throw Error('Source release identity mismatch');
          }
          for(const path of ['public/estate-records.json','public/contact/index.html',
            'public/llms.txt','public/llms-full.txt','public/sitemap.xml',
            'public/robots.txt','public/zh-hans/index.html','public/lkt/index.html']) {
            if((await stat(path)).size<50)throw Error('Missing original publication asset: '+path);
          }
          try { await stat('public/index.html'); throw Error('Competing English static homepage'); }
          catch(error) { if(error.code!=='ENOENT')throw error; }
          const living=JSON.parse(await text('node_modules/@red-cup-engineering/living-web-server/package.json'));
          if(!living.exports?.['./fetch'])throw Error('Installed LivingWebServer lacks Worker Fetch contract');
          if(living.dependencies?.['@red-cup-engineering/computer-web-server'] ||
             living.peerDependenciesMeta?.['@red-cup-engineering/computer-web-server']?.optional!==true) {
            throw Error('This Worker release includes unqualified Node transport dependency semantics');
          }
          console.log('Admitted exact TUFTE + LivingWebServer source '+receipt.sourceCommit);
          NODE
      - uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          wranglerVersion: 4.127.1
          command: deploy --config wrangler.jsonc
      - name: Receive independent public revision, human/agent and retained site routes
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          node --input-type=module <<'NODE'
          const host='https://561.group';
          const read=path=>fetch(host+path,{cache:'no-store',headers:{'cache-control':'no-cache'}});
          const manifest=await read('/source-revision.json');
          if(!manifest.ok)throw Error('Public source receipt not served: '+manifest.status);
          const receipt=await manifest.json();
          if(receipt.sourceCommit!==process.env.GITHUB_SHA)throw Error('Public origin not serving this main commit');
          // Cloudflare's native active version is distinct from the site's source claim.
          const uuid=/^[a-f0-9]{8}-(?:[a-f0-9]{4}-){3}[a-f0-9]{12}$/iu;
          if(!uuid.test(receipt.workerVersionId??''))throw Error('Public receipt lacks executing Worker version metadata');
          const account=process.env.CLOUDFLARE_ACCOUNT_ID,token=process.env.CLOUDFLARE_API_TOKEN;
          if(!/^[a-f0-9]{32}$/iu.test(account??'')||!token)
            throw Error('Qualified provider read credential unavailable for manual release receiving');
          const provider=await fetch('https://api.cloudflare.com/client/v4/accounts/'+account+
            '/workers/scripts/561-group-site/deployments?per_page=10',{
            method:'GET',redirect:'error',cache:'no-store',
            headers:{authorization:'Bearer '+token,accept:'application/json'},
            signal:AbortSignal.timeout(15000)
          });
          if(!provider.ok)throw Error('Cloudflare active-deployment read refused: HTTP '+provider.status);
          const data=await provider.json(),latest=data?.result?.deployments?.[0];
          if(data?.success!==true||!uuid.test(latest?.id??'')||
             latest?.versions?.length!==1||latest.versions[0].percentage!==100||
             latest.versions[0].version_id?.toLowerCase()!==receipt.workerVersionId.toLowerCase()){
            throw Error('Published Worker version is not the Cloudflare active 100%-traffic version');
          }

          const home=await read('/');
          const html=await home.text();
          if(!home.ok || !html.includes('data-tufte') ||
             !html.includes('Work with us') || !html.includes('buy.stripe.com') ||
             html.includes('conurbanized ecosystem')) {
            throw Error('Public HTML is not original TUFTE Group homepage');
          }
          const json=await fetch(host+'/',{cache:'no-store',headers:{accept:'application/json',cookie:'lang=en'}});
          if(!json.ok || !(json.headers.get('content-type')||'').includes('application/json')) {
            throw Error('Public LivingWebServer JSON projection was not received');
          }
          const legacy=await fetch(host+'/index.html',{redirect:'manual'});
          if(legacy.status!==301 || legacy.headers.get('location')!==host+'/') {
            throw Error('Legacy static page remains independently reachable');
          }
          for(const route of ['/contact/','/estate.json','/llms.txt','/zh-hans/','/lkt/']) {
            const response=await read(route);
            if(!response.ok)throw Error('Existing public route missing: '+route+' '+response.status);
          }
          const alias=await fetch('https://www.561.group/',{redirect:'manual'});
          if(alias.status!==301 || alias.headers.get('location')!==host+'/') {
            throw Error('www origin no longer canonicalizes');
          }
          console.log('Received deployed Group source '+receipt.sourceCommit+' on actual public origin');
          NODE
